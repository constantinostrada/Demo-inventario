version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: demo_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario_secret}
      POSTGRES_DB: ${DB_NAME:-demo_inventario}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-inventario} -d ${DB_NAME:-demo_inventario}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - inventario_net

  # ─── Express API ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
      target: development
    container_name: demo_inventario_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:-inventario_secret}
      DB_NAME: ${DB_NAME:-demo_inventario}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./packages/api/src:/app/src:ro
    networks:
      - inventario_net

  # ─── Next.js Web App ──────────────────────────────────────────────────────
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      target: development
    container_name: demo_inventario_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3001}:3001'
    volumes:
      - ./packages/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - inventario_net

volumes:
  postgres_data:
    driver: local

networks:
  inventario_net:
    driver: bridge
